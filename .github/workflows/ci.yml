# Continuous integration for recall.
#
# What it checks:
#   - Style: ruff format and ruff lint over src/.
#   - Packaging: the sdist and wheel build, and the wheel installs into a fresh venv.
#   - Smoke test, run from outside the checkout so only the installed wheel is tested:
#     every module imports, both memory prompts load, and the core commands
#     (index, stats, search, memory, projects, rules, usage, context) succeed with no
#     agent history, using fresh RECALL_HOME and RECALL_MEMORY folders.
#
# Why there are no unit tests: the project deliberately has none. The smoke test
# drives the real `recall` entry point end to end, which catches the regressions
# that matter for a CLI without a test suite to maintain.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Format
        run: uvx ruff@0.16.10 format --check src

      - name: Lint
        run: uvx ruff@0.16.10 check src

      - name: Build
        run: uv build --out-dir "$RUNNER_TEMP/dist"

      - name: Install wheel into a fresh venv
        run: |
          uv venv "$RUNNER_TEMP/venv" --python ${{ matrix.python-version }}
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP"/dist/*.whl

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/venv/bin/activate"
          cd "$RUNNER_TEMP"
          export RECALL_HOME="$(mktemp -d)" RECALL_MEMORY="$(mktemp -d)"

          recall --version
          recall --help

          python - <<'EOF'
          import importlib
          import pkgutil

          import recall

          def fail(name):
              raise RuntimeError(f"failed to import {name}")

          for m in pkgutil.walk_packages(recall.__path__, "recall.", onerror=fail):
              if m.name != "recall.__main__":
                  importlib.import_module(m.name)
          EOF

          python -c "from recall.memory import prompts; prompts.load('extract'); prompts.load('consolidate')"

          recall index
          recall stats
          recall search anything
          recall memory
          recall memory link
          recall projects
          recall projects suggest
          recall rules . || true  # the runner's temp folder is not a repo
          recall usage
          recall context --cwd "$GITHUB_WORKSPACE" --agent codex

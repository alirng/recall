# Continuous integration for recall.
#
# What it checks:
#   - Style: ruff format and ruff lint over src/ and docs/benchmarks/.
#   - Changelog: fragments in changes/ are valid, and a PR edits CHANGELOG.md only on a release-* branch.
#   - Benchmark results: docs/benchmarks/results.jsonl matches its schema and registry, holds nothing
#     private, every chart resolves, figures.json is current, and a PR edits or removes no row.
#   - Packaging: the sdist and wheel build, and the wheel installs into a fresh venv.
#   - Smoke test, run from outside the checkout so only the installed wheel is tested:
#     every module imports, both memory prompts load, and the core commands
#     (index, stats, search, memory, projects, rules, usage, context, status and its edit
#     hook) succeed with no agent history, using fresh RECALL_HOME and RECALL_MEMORY folders.
#
# Why there are no unit tests: the project deliberately has none. The smoke test
# drives the real `recall` entry point end to end, which catches the regressions
# that matter for a CLI without a test suite to maintain.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Format
        run: uvx ruff@0.16.10 format --check src docs/benchmarks

      - name: Lint
        run: uvx ruff@0.16.10 check src docs/benchmarks

      - name: Changelog fragments
        run: python3 tools/changelog.py --check

      - name: Benchmark results store
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Rows are compared with the commit before this one: a pull request's merge ref has the
          # base it was merged onto as its first parent, and a push to main (squash merges) the
          # previous main. Not the current tip of main, which may have gained rows since.
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          uv run --no-project --with "jsonschema>=4.20" python docs/benchmarks/store.py check --base "$GITHUB_SHA^1"

      - name: CHANGELOG.md is edited by releases only
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          if [[ "$BRANCH" != release-* ]] && git diff --name-only "origin/$BASE" HEAD | grep -qx CHANGELOG.md; then
            echo "::error::Add a changes/<topic>.<section>.md fragment instead of editing CHANGELOG.md (see changes/README.md)."
            exit 1
          fi

      - name: Build
        run: uv build --out-dir "$RUNNER_TEMP/dist"

      - name: Install wheel into a fresh venv
        run: |
          uv venv "$RUNNER_TEMP/venv" --python ${{ matrix.python-version }}
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP"/dist/*.whl

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/venv/bin/activate"
          cd "$RUNNER_TEMP"
          export RECALL_HOME="$(mktemp -d)" RECALL_MEMORY="$(mktemp -d)"

          recall --version
          recall --help

          python - <<'EOF'
          import importlib
          import pkgutil

          import recall

          def fail(name):
              raise RuntimeError(f"failed to import {name}")

          for m in pkgutil.walk_packages(recall.__path__, "recall.", onerror=fail):
              if m.name != "recall.__main__":
                  importlib.import_module(m.name)
          EOF

          python -c "from recall.memory import prompts; prompts.load('extract'); prompts.load('consolidate')"

          recall index
          recall stats
          recall search anything
          recall memory
          recall memory link
          recall projects
          recall projects suggest
          recall rules . || true  # the runner's temp folder is not a repo
          recall usage
          recall context --cwd "$GITHUB_WORKSPACE" --agent codex
          recall status
          recall status --json > /dev/null
          readme="$GITHUB_WORKSPACE/README.md"
          echo "{\"session_id\":\"ci\",\"tool_input\":{\"file_path\":\"$readme\"}}" | recall hook --agent claude
          echo "{\"session_id\":\"ci\",\"hook_event_name\":\"SessionStart\",\"cwd\":\"$GITHUB_WORKSPACE\"}" | recall hook --agent codex
          echo "{\"session_id\":\"ci\",\"tool_input\":{\"file_path\":\"$readme\"}}" | recall status --hook --agent claude  # the old entry
          echo '{"session_id":"ci","hook_event_name":"UserPromptSubmit"}' | recall hook --agent claude
          echo '{"session_id":"ci","hook_event_name":"Stop"}' | recall hook --agent claude
          echo '{"session_id":"ci","hook_event_name":"UserPromptSubmit","prompt":"hi"}' | recall hook --agent codex
          echo '{"session_id":"ci","hook_event_name":"Stop","stop_hook_active":false}' | recall hook --agent codex
          echo '{"conversation_id":"ci","hook_event_name":"stop","status":"completed","loop_count":0}' \
            | recall hook --agent cursor
          # Cursor blocks the edit unless its hook answers, so the quiet answer must be "allow".
          echo "{\"conversation_id\":\"ci\",\"hook_event_name\":\"preToolUse\",\"tool_input\":{\"file_path\":\"$readme\"}}" \
            | recall hook --agent cursor | grep -q '"permission": "allow"'

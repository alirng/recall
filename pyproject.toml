[project]
name = "recall-agents"
version = "0.2.0"
description = "One searchable memory of your Claude Code, Codex and Cursor chats, exposed to every agent over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali Rangwala" }]
keywords = ["mcp", "model-context-protocol", "claude-code", "codex", "cursor", "llm", "agents", "memory", "chat-history", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
]
dependencies = ["mcp>=2.3,<3", "pyyaml>=6", "jsonschema>=4.20"]

[project.urls]
Homepage = "https://github.com/alirng/recall"
Issues = "https://github.com/alirng/recall/issues"
Changelog = "https://github.com/alirng/recall/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic>=1"]
embeddings = ["numpy>=2"]

[project.scripts]
recall = "recall.cli:main"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.hatch.build.targets.sdist]
# The published source holds the package and its license; research notes and agent
# instructions stay in the repository.
include = ["src/recall", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # typographic characters in prose are intentional
  "SIM905",                      # word lists read better as one split() string
]

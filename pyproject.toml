[project]
name = "recall-agents"
version = "0.5.0"
description = "One searchable memory of your Claude Code, Codex and Cursor chats, exposed to every agent over MCP."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali Rangwala" }]
keywords = ["mcp", "model-context-protocol", "claude-code", "codex", "cursor", "llm", "agents", "memory", "chat-history", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
]
dependencies = ["mcp>=2.3,<3", "pyyaml>=6", "jsonschema>=4.20"]

[project.urls]
Homepage = "https://github.com/alirng/recall"
Issues = "https://github.com/alirng/recall/issues"
Changelog = "https://github.com/alirng/recall/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic>=1"]
embeddings = ["numpy>=2"]
# Codex compresses week-old chats with zstd. Python 3.14+ reads them without this, and so does the `zstd` command.
zstd = ["zstandard>=0.23; python_version < '3.14'"]

[project.scripts]
recall = "recall.cli:main"

[build-system]
# Exact versions, so a new release of the build backend cannot change what gets published. PEP 639 license
# metadata needs hatchling 1.27 or later; the readme plugin rewrites the PyPI description's links. Bump them
# on purpose: build once with the new versions and check the wheel before a release.
requires = ["hatchling==1.32.4", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "hatchling.build"

# PyPI cannot resolve the README's relative links and images, so the published description
# points them at GitHub instead.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/alirng/recall/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/alirng/recall/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/alirng/recall/blob/main/\1"'

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.hatch.build.targets.sdist]
# The published source holds the package and its license; research notes and agent
# instructions stay in the repository.
include = ["src/recall", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # typographic characters in prose are intentional
  "SIM905",                      # word lists read better as one split() string
]
